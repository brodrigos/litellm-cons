<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiteLLM Cons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #0f172a;
            overflow-y: auto;
            user-select: none;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.7); }
    </style>
</head>
<body class="text-slate-100 h-screen flex flex-col font-sans antialiased">
    <div class="px-5 py-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                <i class="fa-solid fa-gauge-high text-base"></i>
            </div>
            <div>
                <h1 class="text-lg sm:text-base font-bold tracking-tight text-white leading-none">LiteLLM Cons</h1>
                <span class="text-xs sm:text-[11px] text-slate-400 font-medium">Quota Free Tier por Grupo (RPD Hoje)</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="refreshData()" title="Atualizar dados" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition-colors">
                <i class="fa-solid fa-rotate text-xs" id="refresh-icon"></i>
            </button>
            <button onclick="openModelManager()" title="Gerenciar Modelos e Fallback" class="w-8 h-8 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition-colors">
                <i class="fa-solid fa-server text-xs"></i>
            </button>
            <button onclick="restartServer()" title="Reiniciar Servidor LiteLLM Cons" class="w-8 h-8 rounded-lg bg-rose-600 hover:bg-rose-500 text-white flex items-center justify-center transition-colors">
                <i class="fa-solid fa-power-off text-xs"></i>
            </button>
            <button onclick="openSettings()" title="Configurações" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition-colors">
                <i class="fa-solid fa-gear text-xs"></i>
            </button>
        </div>
    </div>

    <div id="models-list" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="text-center py-16 text-slate-500">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-indigo-400"></i>
            <p class="text-sm">Carregando cotas RPD por grupo...</p>
        </div>
    </div>

    <div class="px-5 py-3 bg-slate-900 border-t border-slate-800 text-xs sm:text-[11px] text-slate-400 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" id="status-dot"></span>
            <span id="status-text" class="font-medium">Conectando...</span>
        </div>
        <span id="last-update" class="text-slate-500 font-mono">-</span>
    </div>

    <script>
        let ipcRenderer;
        try {
            ipcRenderer = require("electron").ipcRenderer;
        } catch (e) {
            ipcRenderer = {
                async invoke(channel, ...args) {
                    if (channel === "get-config") {
                        const res = await fetch("/api/config");
                        return await res.json();
                    }
                    if (channel === "fetch-models") {
                        const res = await fetch("/api/models");
                        return await res.json();
                    }
                    if (channel === "fetch-usage") {
                        const res = await fetch("/api/usage");
                        return await res.json();
                    }
                    if (channel === "open-settings-window") {
                        window.location.href = "/settings.html";
                        return true;
                    }
                    if (channel === "save-config") {
                        const res = await fetch("/api/config", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(args[0]) });
                        return await res.json();
                    }
                },
                on() {}
            };
        }

        let config = { maxRequestsByGroup: { default: 1500 } };
        let modelGroupsFromApi = [];
        const modelMeta = {
            'groq-fast': { params: 'LLaMA 3 70B', context: '131,072 tokens' },
            'gemini-fallback': { params: 'Gemini Pro', context: '1,048,576 tokens' },
            'gemini-3.6-flash': { params: 'Gemini 3.6 Flash', context: '1,048,576 tokens' },
            'gemini-3.5-flash': { params: 'Gemini 3.5 Flash', context: '1,048,576 tokens' },
            'gemini-3.5-flash-lite': { params: 'Gemini 3.5 Flash Lite', context: '1,048,576 tokens' },
            'or-lightning': { params: 'Nemotron Lightning', context: '131,072 tokens' },
            'or-super-vl': { params: 'Nemotron Super VL', context: '131,072 tokens' },
            'or-flint': { params: 'Nemotron Flint', context: '131,072 tokens' },
            'or-north': { params: 'Nemotron North', context: '131,072 tokens' },
            'or-inkling': { params: 'Unknown', context: 'Unknown' },
            'or-free': { params: 'Unknown', context: 'Unknown' },
            'default': { params: 'Unknown', context: 'Unknown' }
        };

        async function fetchModelsFromApi() {
            try {
                const res = await ipcRenderer.invoke("fetch-models");
                if (res && res.success && Array.isArray(res.models)) {
                    modelGroupsFromApi = res.models;
                    console.log("Models from API:", modelGroupsFromApi);
                    return res.models;
                }
            } catch (e) { console.error("fetch-models error:", e); }
            return [];
        }

        function refreshData() {
            const icon = document.getElementById("refresh-icon");
            if (icon) icon.classList.add("fa-spin");

            const usagePromise = ipcRenderer.invoke("fetch-usage");
            const now = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
            document.getElementById("last-update").innerText = "Atualizado " + now;

            usagePromise.then((res) => {
                const statusDot = document.getElementById("status-dot");
                const statusText = document.getElementById("status-text");

                if (res && res.success) {
                    statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                    statusText.innerText = "Gateway Conectado (" + (res.totalLogsToday || 0) + " reqs hoje)";
                    renderGroups(res.usage || {});
                } else {
                    statusDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                    statusText.innerText = "Erro: " + (res?.error || "Não conectado");
                    renderGroups(res?.usage || {});
                }
            }).catch((err) => {
                console.error("refreshData error:", err);
                document.getElementById("status-dot").className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                document.getElementById("status-text").innerText = "Erro na comunicação interna";
                renderGroups({});
            }).finally(() => {
                if (icon) setTimeout(() => icon.classList.remove("fa-spin"), 500);
            });
        }

        function renderGroups(usageMap) {
            const container = document.getElementById("models-list");
            container.innerHTML = "";

            const groupsFromApi = modelGroupsFromApi || [];
            const usageGroups = Object.keys(usageMap);

            const allGroupsSet = new Set([...groupsFromApi, ...usageGroups]);
            if (allGroupsSet.size === 0) {
                ["groq-fast", "gemini-fallback", "or-super-vl", "or-flint"].forEach(g => allGroupsSet.add(g));
            }
            const allGroups = Array.from(allGroupsSet);

            allGroups.sort((a, b) => {
                const usageA = usageMap[a] || 0;
                const usageB = usageMap[b] || 0;
                if (usageB !== usageA) return usageB - usageA;
                return a.localeCompare(b);
            });

            if (allGroups.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-500">
                        <i class="fa-solid fa-circle-info text-3xl mb-3"></i>
                        <p class="text-sm">Nenhum grupo de modelo configurado.</p>
                    </div>
                `;
                return;
            }

            allGroups.forEach(groupName => {
                const usedReqs = usageMap[groupName] || 0;
                const maxReqs = (config.maxRequestsByGroup && config.maxRequestsByGroup[groupName]) || config.maxRequestsByGroup?.default || 1500;
                const percent = Math.min(100, Math.round((usedReqs / maxReqs) * 100));
                const remaining = Math.max(0, maxReqs - usedReqs);

                const meta = modelMeta[groupName] || { params: 'Unknown', context: 'Unknown' };

                let barColor = "from-indigo-500 to-blue-500";
                if (percent >= 90) barColor = "from-rose-500 to-red-600";
                else if (percent >= 70) barColor = "from-amber-500 to-yellow-500";

                const card = document.createElement("div");
                card.className = "bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-sm hover:border-slate-700 transition-all";

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div class="flex items-center gap-2 max-w-full">
                            <span class="w-2.5 h-2.5 rounded-full ${percent >= 90 ? "bg-rose-500 animate-ping" : (usedReqs > 0 ? "bg-emerald-400" : "bg-slate-600")}"></span>
                            <span class="text-sm sm:text-xs font-bold text-white truncate" title="${groupName}">${groupName}</span>
                        </div>
                        <div class="text-xs sm:text-[11px] font-mono text-indigo-400">${usedReqs} / ${maxReqs}</div>
                    </div>

                    <div class="text-xs sm:text-[11px] text-slate-400 mb-2">
                        <span class="flex items-center gap-1"><i class="fa-solid fa-layer-group text-slate-500"></i> Contexto: <span class="text-slate-200">${meta.context}</span></span>
                    </div>

                    <div class="w-full bg-slate-950 rounded-full h-2.5 overflow-hidden border border-slate-800 my-2">
                        <div class="bg-gradient-to-r ${barColor} h-full rounded-full transition-all duration-500" style="width: ${Math.max(1, percent)}%"></div>
                    </div>

                    <div class="flex justify-between items-center text-xs sm:text-[11px] text-slate-400">
                        <span>Restam: <strong class="${remaining === 0 ? 'text-rose-400' : 'text-emerald-400'} font-mono">${remaining} reqs</strong></span>
                        <span class="font-semibold">${percent}% usado</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openSettings() { ipcRenderer.invoke("open-settings-window"); }

        // ── Modelos / Fallback / Gerenciamento ──
        let currentModels = [];
        let currentFallbacks = {};
        let managerTab = 'models'; // 'models' | 'fallbacks'

        async function openModelManager() {
            // Buscar modelos do LiteLLM e fallbacks do router
            try {
                const modelsRes = await ipcRenderer.invoke("fetch-models");
                currentModels = (modelsRes && modelsRes.success && Array.isArray(modelsRes.models)) ? modelsRes.models : [];
            } catch (e) { currentModels = []; console.error("fetch-models error:", e); }

            try {
                const rtRes = await fetch("/api/router-settings");
                const rt = await rtRes.json();
                if (rt.success && rt.settings) {
                    const fb = rt.settings.current_values?.fallbacks || rt.settings.fallbacks || [];
                    currentFallbacks = {};
                    fb.forEach(item => {
                        const key = Object.keys(item)[0];
                        currentFallbacks[key] = item[key] || [];
                    });
                }
            } catch (e) { console.error("router-settings error:", e); }

            document.getElementById("model-manager-modal").classList.remove("hidden");
            document.getElementById("model-manager-modal").classList.add("flex");
            renderModelManager();
        }

        function closeModelManager() {
            document.getElementById("model-manager-modal").classList.add("hidden");
            document.getElementById("model-manager-modal").classList.remove("flex");
        }

        async function saveModels() {
            const cfg = await ipcRenderer.invoke("get-config");
            const unique = Array.from(new Set(currentModels.filter(Boolean)));
            cfg.modelGroups = unique;
            if (!cfg.modelTimeouts) cfg.modelTimeouts = {};
            document.querySelectorAll('#manager-list input[data-model]').forEach(input => {
                const modelName = input.getAttribute('data-model');
                cfg.modelTimeouts[modelName] = Number(input.value) || 120;
            });
            await ipcRenderer.invoke("save-config", cfg);
            currentModels = unique;
            renderModelManager();
            fetchModelsFromApi().then(() => refreshData());
            alert("Lista de modelos e timeouts salvos com sucesso.");
        }

        function addModel() {
            const input = document.getElementById("new-model-input");
            const name = input.value.trim();
            if (!name) return;
            if (currentModels.includes(name)) { alert("Este modelo já existe."); return; }
            currentModels.push(name);
            input.value = "";
            renderModelManager();
        }

        function removeModel(name) {
            if (!confirm(`Remover o modelo "${name}"?`)) return;
            currentModels = currentModels.filter(m => m !== name);
            renderModelManager();
        }

        function renderModelManager() {
            const container = document.getElementById("manager-list");
            container.innerHTML = "";

            if (managerTab === 'models') {
                // Lista de modelos com remoção e adição
                const header = document.createElement("div");
                header.className = "flex items-center gap-2 mb-4";
                header.innerHTML = `<i class="fa-solid fa-cubes text-indigo-400"></i>
                    <span class="text-sm font-semibold text-slate-200">Modelos do LiteLLM</span>`;
                container.appendChild(header);

                if (currentModels.length === 0) {
                    container.innerHTML += `<div class="text-center py-6 text-slate-500 text-sm">Nenhum modelo cadastrado.</div>`;
                } else {
                    const cfgTimeouts = await ipcRenderer.invoke("get-config");
                    const modelTimeouts = cfgTimeouts?.modelTimeouts || {};
                    currentModels.forEach((name, idx) => {
                        const row = document.createElement("div");
                        row.className = "flex items-center justify-between gap-3 bg-slate-800/50 rounded-xl p-3 mb-2 border border-slate-700";
                        row.innerHTML = `
                            <div class="flex items-center gap-3 w-full">
                                <span class="w-6 h-6 rounded-full bg-slate-600 flex items-center justify-center text-xs text-slate-300">${idx + 1}</span>
                                <span class="text-sm text-slate-200 truncate" title="${name}">${name}</span>
                                <input type="number" data-model="${name}" value="${modelTimeouts[name] || 120}" placeholder="timeout (s)" class="bg-slate-950 border border-slate-800 rounded px-2 py-1 text-[10px] text-slate-200 w-16 focus:outline-none focus:border-indigo-500">
                            </div>
                            <button onclick="removeModel('${name.replace(/'/g, "\\'")}')" class="text-xs text-rose-400 hover:text-rose-300">
                                <i class="fa-solid fa-trash-alt"></i>
                            </button>
                        `;
                        container.appendChild(row);
                    });
                }

                const addSection = document.createElement("div");
                addSection.className = "mt-6 pt-6 border-t border-slate-800";
                addSection.innerHTML = `
                    <div class="flex items-center gap-2 mb-3">
                        <i class="fa-solid fa-plus-circle text-indigo-400"></i>
                        <span class="text-sm font-semibold text-slate-200">Adicionar Modelo</span>
                    </div>
                    <div class="flex gap-2 mb-4">
                        <input type="text" id="new-model-input" placeholder="ex: groq-fast, gemini-fallback, or-super-vl" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        <button onclick="addModel()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2 rounded-xl font-medium transition-colors">Adicionar</button>
                    </div>
                    <button onclick="saveModels()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 rounded-xl shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-save"></i> Salvar Lista de Modelos
                    </button>
                `;
                container.appendChild(addSection);
            } else {
                // Fallbacks
                const header = document.createElement("div");
                header.className = "flex items-center gap-2 mb-4";
                header.innerHTML = `<i class="fa-solid fa-share-nodes text-indigo-400"></i>
                    <span class="text-sm font-semibold text-slate-200">Ordem de Fallback por Modelo</span>`;
                container.appendChild(header);

                const p = document.createElement("p");
                p.className = "text-xs text-slate-500 mb-4";
                p.textContent = "Ordem em que o LiteLLM tenta fallback quando o modelo principal falha.";
                container.appendChild(p);

                const modelKeys = Object.keys(currentFallbacks);
                if (modelKeys.length === 0) {
                    container.innerHTML += `<div class="text-center py-6 text-slate-500 text-sm">Nenhuma configuração de fallback encontrada.</div>`;
                } else {
                    modelKeys.forEach(modelName => {
                        const fallbacks = currentFallbacks[modelName] || [];
                        const card = document.createElement("div");
                        card.className = "bg-slate-800/50 rounded-xl p-4 mb-4 border border-slate-700";
                        card.innerHTML = `
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-xs font-bold text-indigo-400 truncate" title="${modelName}">${modelName}</span>
                                <span class="text-[10px] text-slate-500">${fallbacks.length} fallback(s)</span>
                            </div>
                            <div class="space-y-1" id="fb-list-${modelName.replace(/[^a-zA-Z0-9]/g, '_')}">
                                ${fallbacks.map((fb, i) => `
                                    <div class="flex items-center justify-between gap-2 bg-slate-900/60 rounded-lg p-2 border border-slate-700">
                                        <span class="w-5 h-5 rounded-full bg-slate-600 flex items-center justify-center text-[10px] text-slate-300">${i + 1}</span>
                                        <span class="flex-1 text-xs text-slate-200 truncate" title="${fb}">${fb}</span>
                                        <button onclick="removeFallback('${modelName.replace(/'/g, "\\'")}', '${fb.replace(/'/g, "\\'")}')" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-times"></i></button>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="mt-2 flex gap-2">
                                <input type="text" id="new-fb-${modelName.replace(/[^a-zA-Z0-9]/g, '_')}" placeholder="modelo de fallback" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-[10px] text-slate-200 focus:outline-none focus:border-indigo-500">
                                <button onclick="addFallback('${modelName.replace(/'/g, "\\'")}')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] px-2 py-1.5 rounded-lg">+</button>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }

                const btns = document.createElement("div");
                btns.className = "mt-4 flex gap-2";
                btns.innerHTML = `
                    <button onclick="saveFallbacks()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 rounded-xl shadow-lg shadow-emerald-600/30 transition-all">
                        Salvar Fallbacks
                    </button>
                    <button onclick="pushFallbacksToGateway()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2 rounded-xl transition-all">
                        Enviar para Gateway
                    </button>
                `;
                container.appendChild(btns);
            }
        }

        function switchManagerTab(tab) {
            managerTab = tab;
            document.getElementById("tab-models").className = tab === 'models' ? "text-xs font-bold text-indigo-400 border-b-2 border-indigo-500 pb-1" : "text-xs font-bold text-slate-500 hover:text-slate-300 pb-1";
            document.getElementById("tab-fallbacks").className = tab === 'fallbacks' ? "text-xs font-bold text-indigo-400 border-b-2 border-indigo-500 pb-1" : "text-xs font-bold text-slate-500 hover:text-slate-300 pb-1";
            renderModelManager();
        }

        function addFallback(modelName) {
            const id = modelName.replace(/[^a-zA-Z0-9]/g, '_');
            const input = document.getElementById("new-fb-" + id);
            const name = input.value.trim();
            if (!name) return;
            const fallbacks = currentFallbacks[modelName] || [];
            if (fallbacks.includes(name)) { alert("Este fallback já existe para este modelo."); return; }
            fallbacks.push(name);
            currentFallbacks[modelName] = fallbacks;
            input.value = "";
            renderModelManager();
        }

        function removeFallback(modelName, fbName) {
            const fallbacks = currentFallbacks[modelName] || [];
            currentFallbacks[modelName] = fallbacks.filter(f => f !== fbName);
            renderModelManager();
        }

        async function saveFallbacks() {
            const fbArray = Object.entries(currentFallbacks).map(([key, val]) => ({ [key]: val }));
            const cfg = await ipcRenderer.invoke("get-config");
            cfg.fallbacks = fbArray;
            await ipcRenderer.invoke("save-config", cfg);
            alert("Fallbacks salvos localmente.");
        }

        async function pushFallbacksToGateway() {
            // Tenta enviar fallbacks para o LiteLLM Gateway (requer STORE_MODEL_IN_DB=True para /model/new)
            try {
                const rtRes = await fetch("/api/router-settings");
                const rt = await rtRes.json();
                if (!rt.success || !rt.settings) throw new Error("Sem resposta do gateway");

                const currentValues = rt.settings.current_values || rt.settings || {};
                const newSettings = { ...currentValues, fallbacks: Object.entries(currentFallbacks).map(([key, val]) => ({ [key]: val })) };

                const resp = await fetch("http://" + (await (await fetch("/api/config")).json()).litellmHost + ":" + (await (await fetch("/api/config")).json()).litellmPort + "/router/settings", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + (await (await fetch("/api/config")).json()).litellmApiKey },
                    body: JSON.stringify(newSettings)
                });
                if (resp.ok) {
                    alert("Fallbacks enviados para o LiteLLM Gateway com sucesso.");
                } else {
                    const err = await resp.json().catch(() => ({}));
                    alert("Falha ao enviar fallbacks: " + (err.detail || err.message || resp.status));
                }
            } catch (e) {
                alert("Erro ao enviar fallbacks: " + e.message);
            }
        }

        async function restartServer() {
            if (!confirm("Deseja testar/reiniciar a conexão com o LiteLLM Gateway em 192.168.1.130?")) return;
            try {
                const res = await fetch("/api/restart-litellm", { method: "POST" });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                } else {
                    alert("Aviso: " + data.error);
                }
                refreshData();
            } catch (e) {
                alert("Erro ao reiniciar/testar LiteLLM: " + e.message);
            }
        }

        ipcRenderer.on("config-updated", (event, newCfg) => { config = newCfg; refreshData(); });

        async function init() {
            try {
                const cfg = await ipcRenderer.invoke("get-config");
                if (cfg && cfg.maxRequestsByGroup) config = cfg;
            } catch (e) { console.error("get-config error:", e); }

            refreshData();
            fetchModelsFromApi().then(() => refreshData());
            setInterval(refreshData, 30000);
        }

        init();
    </script>

    <!-- Modal Gerenciar Modelos / Fallbacks -->
    <div id="model-manager-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex items-center justify-between">
                <h2 class="text-sm font-bold text-indigo-300 flex items-center gap-2">
                    <i class="fa-solid fa-server"></i> Gerenciar Modelos & Fallback
                </h2>
                <button onclick="closeModelManager()" class="text-slate-400 hover:text-white text-sm">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-4">
                <!-- Tabs -->
                <div class="flex gap-1 mb-4 border-b border-slate-800">
                    <button id="tab-models" onclick="switchManagerTab('models')" class="text-xs font-bold text-indigo-400 border-b-2 border-indigo-500 pb-1 px-3">Modelos</button>
                    <button id="tab-fallbacks" onclick="switchManagerTab('fallbacks')" class="text-xs font-bold text-slate-500 hover:text-slate-300 pb-1 px-3">Fallbacks</button>
                </div>

                <div id="manager-list"></div>
            </div>

            <div class="p-3 border-t border-slate-800 bg-slate-900/80 flex justify-end gap-2">
                <button onclick="closeModelManager()" class="text-xs text-slate-400 hover:text-white px-4 py-2 rounded-lg transition-colors">Fechar</button>
            </div>
        </div>
    </div>
</body>
</html>
